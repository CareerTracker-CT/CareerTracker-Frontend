    <rect x="54" y="54" width="250" height="18" rx="9" fill="#172b3b"/>
    <rect x="54" y="92" width="180" height="10" rx="5" fill="#b58b6b"/>
    <circle cx="735" cy="76" r="30" fill="#d5a36f"/>
    <circle cx="735" cy="76" r="13" fill="#fff4dc"/>
    <rect x="54" y="160" width="420" height="220" rx="12" fill="#172b3b"/>
    <text x="86" y="207" fill="#d5a36f" font-family="sans-serif" font-size="18" letter-spacing="3">READINESS SCORE</text>
    <text x="82" y="305" fill="#fffdf7" font-family="sans-serif" font-size="92" font-weight="700">62</text>
    <text x="230" y="300" fill="#b6c3c6" font-family="sans-serif" font-size="22">/100</text>
    <path d="M550 328a110 110 0 1 1 145-103" fill="none" stroke="#d5a36f" stroke-width="28" stroke-linecap="round"/>
    <path d="M550 328a110 110 0 0 1-73-84" fill="none" stroke="#dce5df" stroke-width="28" stroke-linecap="round"/>
    <rect x="54" y="438" width="742" height="2" fill="#d8cdbc"/>
    <g fill="#172b3b">
      <rect x="54" y="480" width="190" height="14" rx="7"/>
      <rect x="54" y="520" width="290" height="10" rx="5" fill="#a58b76"/>
      <rect x="54" y="560" width="230" height="10" rx="5" fill="#a58b76"/>
      <rect x="54" y="600" width="340" height="10" rx="5" fill="#a58b76"/>
    </g>
    <g transform="translate(490 470)">
      <rect width="306" height="145" rx="12" fill="#e7c28e"/>
      <rect x="24" y="28" width="130" height="10" rx="5" fill="#172b3b"/>
      <rect x="24" y="64" width="230" height="8" rx="4" fill="#765b49" opacity=".7"/>
      <rect x="24" y="94" width="180" height="8" rx="4" fill="#765b49" opacity=".7"/>
