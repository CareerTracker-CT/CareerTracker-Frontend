<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Career readiness dossier</title>
  <desc id="desc">A warm editorial workspace with a career readiness dashboard and printed notes.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c4a7"/>
      <stop offset="1" stop-color="#9c765d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#e9e0d1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#47362c" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#desk)"/>
  <path d="M0 160C230 90 390 220 620 130S1000 70 1200 170V0H0Z" fill="#f3dfbd" opacity=".45"/>
